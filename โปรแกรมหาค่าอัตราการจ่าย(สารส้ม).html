<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>คำนวณอัตราการจ่ายสารเคมี(สารส้ม)</title>

    <!-- PWA & Mobile App Meta Tags (รองรับ iOS & Android เต็มจอ) -->
    <meta name="theme-color" content="#1e40af">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="จ่ายสารส้ม">
    <meta name="description" content="แอปคำนวณอัตราการจ่ายสารเคมี(สารส้ม) สำหรับงานผลิตน้ำประปา">

    <!-- ไอคอนแอป SVG แบบฝังในตัว (ใช้เป็น Apple Touch Icon และ Manifest Icon) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%231e40af'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='url(%23g)'/%3E%3Cpath d='M256 96C256 96 144 226 144 312C144 373.86 194.14 424 256 424C317.86 424 368 373.86 368 312C368 226 256 96 256 96Z' fill='%23ffffff'/%3E%3Cpath d='M212 318C212 342.3 231.7 362 256 362' stroke='%232563eb' stroke-width='22' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
    <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%231e40af'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' fill='url(%23g)'/%3E%3Cpath d='M256 96C256 96 144 226 144 312C144 373.86 194.14 424 256 424C317.86 424 368 373.86 368 312C368 226 256 96 256 96Z' fill='%23ffffff'/%3E%3Cpath d='M212 318C212 342.3 231.7 362 256 362' stroke='%232563eb' stroke-width='22' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">

    <!-- Web App Manifest แบบ Data URI (ตั้งค่า Dynamically ผ่าน JS เพื่อรองรับ start_url ปัจจุบัน) -->
    <link id="pwaManifestLink" rel="manifest" href="">

    <!-- โหลด Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- โหลดฟอนต์ภาษาไทย Sarabun และ Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Sarabun', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
            padding-top: env(safe-area-inset-top);
            padding-bottom: env(safe-area-inset-bottom);
        }
        h1, .font-heading {
            font-family: 'Prompt', sans-serif;
        }
        /* ซ่อนปุ่มลูกศรขึ้น-ลงมาตรฐานของ input type="number" */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        /* แอนิเมชันแจ้งเตือนและหน้าต่างแนะนำติดตั้งแอป */
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-slide-up {
            animation: slideUp 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="min-h-screen flex items-start sm:items-center justify-center p-3 sm:p-6 text-slate-800">

    <!-- การ์ดหลักของแอปพลิเคชัน -->
    <main class="w-full max-w-[440px] bg-white rounded-2xl shadow-md border border-slate-200/80 overflow-hidden my-1 sm:my-4">

        <!-- ส่วนหัวสีน้ำเงินเข้มไล่เฉด แสดงหัวข้อและคำอธิบายแบบเต็มพื้นที่ -->
        <header class="bg-gradient-to-br from-[#1e40af] via-[#1d4ed8] to-[#2563eb] px-6 py-5 text-white">
            <h1 class="text-[20px] sm:text-[22px] font-bold tracking-tight leading-snug">
                คำนวณอัตราการจ่ายสารเคมี(สารส้ม)
            </h1>
            <p class="text-sm text-blue-100/90 mt-1 font-normal">
                กรอกค่าหน้างานเพื่อคำนวณอัตโนมัติ
            </p>
        </header>

        <!-- พื้นที่เนื้อหาหลัก -->
        <div class="p-5 sm:p-6 space-y-5">

            <!-- ส่วนที่ 1: กรอกข้อมูลหน้างาน 3 ช่อง -->
            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <h2 class="text-[15px] font-bold text-slate-600">
                        1. กรอกข้อมูลหน้างาน
                    </h2>
                    <span id="offlineBadge" class="hidden text-[11px] font-semibold px-2 py-0.5 rounded-full bg-amber-100 text-amber-800">
                        โหมดออฟไลน์
                    </span>
                </div>

                <!-- ช่องที่ 1: ผลจาร์เทส -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between text-sm">
                        <label for="jarTestInput" class="font-bold text-slate-700">
                            ผลจาร์เทส
                        </label>
                        <span class="text-xs text-slate-500">
                            หน่วย: มก./ล.
                        </span>
                    </div>
                    <input
                        type="number"
                        id="jarTestInput"
                        inputmode="decimal"
                        step="any"
                        value="8"
                        placeholder="0"
                        oninput="calculateAndSave()"
                        class="w-full h-12 px-4 rounded-xl bg-[#f8fafc] border border-[#cbd5e1] text-lg font-bold text-slate-900 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition"
                    >
                </div>

                <!-- ช่องที่ 2: อัตราสูบ -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between text-sm">
                        <label for="pumpRateInput" class="font-bold text-slate-700">
                            อัตราสูบ
                        </label>
                        <span class="text-xs text-slate-500">
                            หน่วย: ลบ.ม./ชม.
                        </span>
                    </div>
                    <input
                        type="number"
                        id="pumpRateInput"
                        inputmode="decimal"
                        step="any"
                        value="240"
                        placeholder="0"
                        oninput="calculateAndSave()"
                        class="w-full h-12 px-4 rounded-xl bg-[#f8fafc] border border-[#cbd5e1] text-lg font-bold text-slate-900 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition"
                    >
                </div>

                <!-- ช่องที่ 3: ความถ่วงจำเพาะ (SG) -->
                <div class="space-y-1.5">
                    <div class="flex items-center justify-between text-sm">
                        <label for="sgInput" class="font-bold text-slate-700">
                            ความถ่วงจำเพาะ (SG)
                        </label>
                        <span class="text-xs text-slate-500">
                            เช่น 1.010
                        </span>
                    </div>
                    <input
                        type="number"
                        id="sgInput"
                        inputmode="decimal"
                        step="0.001"
                        value="1.010"
                        placeholder="1.010"
                        oninput="calculateAndSave()"
                        class="w-full h-12 px-4 rounded-xl bg-[#f8fafc] border border-[#cbd5e1] text-lg font-bold text-slate-900 focus:bg-white focus:border-blue-600 focus:ring-2 focus:ring-blue-500/20 outline-none transition"
                    >
                </div>
            </section>

            <!-- ส่วนที่ 2: ผลการคำนวณ -->
            <section class="space-y-3">
                <h2 class="text-[15px] font-bold text-slate-600">
                    2. ผลการคำนวณ
                </h2>

                <!-- กล่องผลลัพธ์สีฟ้าอ่อนขอบมน -->
                <div class="bg-[#f0f7ff] border border-[#bfdbfe] rounded-2xl p-5 text-center">
                    <p class="text-[15px] font-bold text-[#1e40af]">
                        อัตราการจ่ายสารเคมี
                    </p>

                    <!-- ตัวเลขหลักขนาดใหญ่ปัดจำนวนเต็ม -->
                    <div id="dosingRateDisplay" class="font-heading text-5xl sm:text-[56px] font-bold text-[#1d4ed8] my-2 leading-none tracking-tight">
                        85
                    </div>

                    <p class="text-sm font-bold text-[#1e40af]">
                        ลิตร / ชั่วโมง
                    </p>
                    <p id="dosingExactDisplay" class="text-xs text-blue-600/80 mt-1 font-medium">
                        (ค่าละเอียด 84.58 ลิตร/ชม.)
                    </p>

                    <!-- เส้นแบ่งประบางๆ -->
                    <div class="border-t border-dashed border-blue-200 my-4"></div>

                    <!-- แถวแสดงความเข้มข้น (% สารเคมี) -->
                    <div class="flex items-center justify-between text-sm sm:text-[15px] px-1">
                        <span class="font-semibold text-slate-600">
                            ความเข้มข้น (% สารเคมี)
                        </span>
                        <span id="concentrationDisplay" class="font-bold text-[#1e40af] text-base sm:text-lg">
                            2.27 %
                        </span>
                    </div>
                </div>
            </section>

            <!-- ส่วนที่ 3: ปุ่มแชร์ไปยัง LINE โดยตรง และปุ่มเสริม -->
            <section class="space-y-2.5 pt-1">
                <!-- ปุ่มหลักสีเขียว LINE แชร์รายงานได้ทันที -->
                <button
                    type="button"
                    id="shareLineBtn"
                    onclick="shareToLine()"
                    class="w-full py-3.5 px-5 rounded-xl bg-[#06C755] hover:bg-[#05b34c] active:scale-[0.98] disabled:bg-slate-200 disabled:text-slate-400 text-white font-bold text-base shadow-sm transition flex items-center justify-center gap-2.5"
                >
                    <!-- ไอคอนแชท LINE -->
                    <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                        <path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/>
                    </svg>
                    <span>แชร์ไปยัง LINE</span>
                </button>

                <!-- ปุ่มเสริมด้านล่าง: คัดลอกข้อความ และ ล้างค่า -->
                <div class="grid grid-cols-2 gap-2.5">
                    <button
                        type="button"
                        id="copyBtn"
                        onclick="copyReportText()"
                        class="py-2.5 px-3 rounded-xl bg-slate-100 hover:bg-slate-200 active:scale-[0.98] disabled:opacity-50 text-slate-700 text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-1.5"
                    >
                        <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"></path>
                        </svg>
                        <span id="copyBtnText">คัดลอกข้อความ</span>
                    </button>

                    <button
                        type="button"
                        onclick="clearAllInputs()"
                        class="py-2.5 px-3 rounded-xl bg-rose-50 hover:bg-rose-100 active:scale-[0.98] text-rose-600 text-xs sm:text-sm font-semibold transition flex items-center justify-center gap-1.5"
                    >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        <span>ล้างค่า</span>
                    </button>
                </div>
            </section>

        </div>
    </main>

    <!-- กล่องแจ้งเตือนแบบลอย (Toast Message) -->
    <div id="toastBanner" class="fixed bottom-5 left-1/2 -translate-x-1/2 bg-slate-900/95 text-white px-4 py-2.5 rounded-full text-xs font-semibold shadow-lg hidden items-center gap-2 z-50 whitespace-nowrap">
        <span class="w-2 h-2 rounded-full bg-emerald-400"></span>
        <span id="toastMessage">คัดลอกข้อความเรียบร้อย</span>
    </div>

    <script>
        // คีย์สำหรับบันทึกค่าล่าสุดลงในเครื่อง (localStorage)
        const STORAGE_KEY = 'alum_pwa_last_inputs_v1';

        // ตัวแปรเก็บผลลัพธ์ล่าสุด
        let latestReportData = null;
        let toastTimer = null;

        // 1. ตั้งค่า PWA (Web App Manifest + Service Worker สำหรับทำงานออฟไลน์)
        function setupPWA() {
            // สร้างไอคอน SVG ขนาด 192x192 และ 512x512
            const svgIcon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#1e40af"/><stop offset="100%" stop-color="#2563eb"/></linearGradient></defs><rect width="512" height="512" rx="112" fill="url(#g)"/><path d="M256 96C256 96 144 226 144 312C144 373.86 194.14 424 256 424C317.86 424 368 373.86 368 312C368 226 256 96 256 96Z" fill="#ffffff"/><path d="M212 318C212 342.3 231.7 362 256 362" stroke="#2563eb" stroke-width="22" stroke-linecap="round" fill="none"/></svg>`;
            const iconDataUri = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);

            // สร้าง Web App Manifest แบบ JSON และฝังผ่าน Data URI
            const manifestObj = {
                name: 'คำนวณอัตราการจ่ายสารเคมี(สารส้ม)',
                short_name: 'จ่ายสารส้ม',
                description: 'โปรแกรมคำนวณอัตราการจ่ายสารเคมี(สารส้ม) สำหรับงานประปา',
                start_url: window.location.href,
                display: 'standalone',
                orientation: 'portrait',
                background_color: '#f1f5f9',
                theme_color: '#1e40af',
                icons: [
                    { src: iconDataUri, sizes: '192x192', type: 'image/svg+xml', purpose: 'any maskable' },
                    { src: iconDataUri, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }
                ]
            };

            const manifestDataUri = 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(manifestObj));
            const manifestLink = document.getElementById('pwaManifestLink');
            if (manifestLink) {
                manifestLink.setAttribute('href', manifestDataUri);
            }

            // ลงทะเบียน Inline Service Worker เพื่อแคชหน้าแอปให้ใช้งานออฟไลน์ได้ (เมื่อเปิดผ่าน HTTPS)
            if ('serviceWorker' in navigator && window.location.protocol === 'https:') {
                const swCode = `
                    const CACHE_NAME = 'alum-dosing-pwa-v1';
                    self.addEventListener('install', (event) => {
                        self.skipWaiting();
                        event.waitUntil(
                            caches.open(CACHE_NAME).then((cache) => cache.addAll([self.location.href]).catch(() => {}))
                        );
                    });
                    self.addEventListener('activate', (event) => {
                        event.waitUntil(self.clients.claim());
                    });
                    self.addEventListener('fetch', (event) => {
                        if (event.request.method !== 'GET') return;
                        event.respondWith(
                            fetch(event.request)
                                .then((response) => {
                                    const resClone = response.clone();
                                    caches.open(CACHE_NAME).then((cache) => cache.put(event.request, resClone)).catch(() => {});
                                    return response;
                                })
                                .catch(() => caches.match(event.request))
                        );
                    });
                `;
                try {
                    const swBlob = new Blob([swCode], { type: 'application/javascript' });
                    const swUrl = URL.createObjectURL(swBlob);
                    navigator.serviceWorker.register(swUrl).catch(() => {});
                } catch (e) {}
            }

            // ตรวจสอบสถานะการเชื่อมต่ออินเทอร์เน็ต (Online / Offline)
            updateNetworkStatus();
            window.addEventListener('online', updateNetworkStatus);
            window.addEventListener('offline', updateNetworkStatus);
        }

        function updateNetworkStatus() {
            const offlineBadge = document.getElementById('offlineBadge');
            if (!navigator.onLine) {
                offlineBadge.classList.remove('hidden');
            } else {
                offlineBadge.classList.add('hidden');
            }
        }

        // 2. โหลดค่าที่เคยกรอกล่าสุดจาก localStorage
        function loadSavedInputs() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const data = JSON.parse(raw);
                    if (data.jarTest !== undefined) document.getElementById('jarTestInput').value = data.jarTest;
                    if (data.pumpRate !== undefined) document.getElementById('pumpRateInput').value = data.pumpRate;
                    if (data.sg !== undefined) document.getElementById('sgInput').value = data.sg;
                }
            } catch (e) {}
        }

        function saveInputsToStorage(jarTest, pumpRate, sg) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify({
                    jarTest: jarTest,
                    pumpRate: pumpRate,
                    sg: sg
                }));
            } catch (e) {}
        }

        // 3. คำนวณผลลัพธ์ตามสูตรที่กำหนด
        function calculateAndSave() {
            const jarTestRaw = document.getElementById('jarTestInput').value.trim();
            const pumpRateRaw = document.getElementById('pumpRateInput').value.trim();
            const sgRaw = document.getElementById('sgInput').value.trim();

            saveInputsToStorage(jarTestRaw, pumpRateRaw, sgRaw);

            const dosingDisplay = document.getElementById('dosingRateDisplay');
            const dosingExactDisplay = document.getElementById('dosingExactDisplay');
            const concDisplay = document.getElementById('concentrationDisplay');
            const shareBtn = document.getElementById('shareLineBtn');
            const copyBtn = document.getElementById('copyBtn');

            const jarTest = parseFloat(jarTestRaw);
            const pumpRate = parseFloat(pumpRateRaw);
            const sg = parseFloat(sgRaw);

            // ตรวจสอบค่าความถ่วงจำเพาะ (SG)
            if (sgRaw === '' || isNaN(sg)) {
                setInvalidState(dosingDisplay, dosingExactDisplay, concDisplay, shareBtn, copyBtn);
                return;
            }

            // สูตรหาความเข้มข้น (% สารเคมี) = ((SG - 0.9989) / 0.0049) ปัดทศนิยม 2 ตำแหน่ง
            const conc = Math.round(((sg - 0.9989) / 0.0049) * 100) / 100;

            if (conc <= 0 || !isFinite(conc)) {
                setInvalidState(dosingDisplay, dosingExactDisplay, concDisplay, shareBtn, copyBtn);
                return;
            }

            concDisplay.textContent = `${conc.toFixed(2)} %`;

            // ตรวจสอบค่าผลจาร์เทสและอัตราสูบ
            if (jarTestRaw === '' || pumpRateRaw === '' || isNaN(jarTest) || isNaN(pumpRate) || jarTest < 0 || pumpRate < 0) {
                dosingDisplay.textContent = '-';
                dosingExactDisplay.textContent = '';
                shareBtn.disabled = true;
                copyBtn.disabled = true;
                latestReportData = null;
                return;
            }

            // สูตรหาอัตราการจ่ายสารเคมี = (ผลจาร์เทส * อัตราสูบ) / (10 * % สารเคมี)
            const dosingRateExact = (jarTest * pumpRate) / (10 * conc);
            const dosingRateRounded = Math.round(dosingRateExact);

            dosingDisplay.textContent = dosingRateRounded.toLocaleString('en-US');
            dosingExactDisplay.textContent = `(ค่าละเอียด ${dosingRateExact.toFixed(2)} ลิตร/ชม.)`;

            shareBtn.disabled = false;
            copyBtn.disabled = false;

            latestReportData = {
                jarTest: jarTest,
                pumpRate: pumpRate,
                sg: sg.toFixed(3),
                conc: conc.toFixed(2),
                dosingRounded: dosingRateRounded,
                dosingExact: dosingRateExact.toFixed(2)
            };
        }

        function setInvalidState(dosingDisplay, dosingExactDisplay, concDisplay, shareBtn, copyBtn) {
            dosingDisplay.textContent = '-';
            dosingExactDisplay.textContent = '';
            concDisplay.textContent = '- %';
            shareBtn.disabled = true;
            copyBtn.disabled = true;
            latestReportData = null;
        }

        // ล้างค่าช่องกรอกทั้งหมด
        function clearAllInputs() {
            document.getElementById('jarTestInput').value = '';
            document.getElementById('pumpRateInput').value = '';
            document.getElementById('sgInput').value = '';
            calculateAndSave();
            document.getElementById('jarTestInput').focus();
            showToast('ล้างข้อมูลเรียบร้อย');
        }

        // 5. สร้างข้อความรายงานสำหรับส่งไปยัง LINE
        function buildLineReportText() {
            if (!latestReportData) return '';

            const now = new Date();
            const dateStr = now.toLocaleDateString('th-TH', {
                day: 'numeric',
                month: 'short',
                year: '2-digit'
            });
            const timeStr = now.toLocaleTimeString('th-TH', {
                hour: '2-digit',
                minute: '2-digit'
            });

            return [
                `💧 รายงานคำนวณอัตราการจ่ายสารเคมี(สารส้ม)`,
                `📅 วันที่ ${dateStr} เวลา ${timeStr} น.`,
                `━━━━━━━━━━━━━━━━━━`,
                `• ผลจาร์เทส : ${latestReportData.jarTest} มก./ล.`,
                `• อัตราสูบ : ${latestReportData.pumpRate} ลบ.ม./ชม.`,
                `• ความถ่วงจำเพาะ (SG) : ${latestReportData.sg}`,
                `• ความเข้มข้น (% สารเคมี) : ${latestReportData.conc} %`,
                `━━━━━━━━━━━━━━━━━━`,
                `✅ อัตราการจ่ายสารเคมี : ${latestReportData.dosingRounded} ลิตร/ชั่วโมง`,
                `(ค่าละเอียด ${latestReportData.dosingExact} ลิตร/ชม.)`
            ].join('\n');
        }

        // แชร์ไปยังแอป LINE โดยตรง (ใช้ LINE URL Scheme + Web Share API)
        async function shareToLine() {
            const reportText = buildLineReportText();
            if (!reportText) return;

            // คัดลอกสำรองลงคลิปบอร์ดเผื่อกรณีเปิดบนคอมพิวเตอร์ที่ไม่ได้ติดตั้ง LINE
            copyToClipboardFallback(reportText);

            const encodedText = encodeURIComponent(reportText);
            const lineShareUrl = `https://line.me/R/msg/text/?${encodedText}`;

            // ตรวจสอบว่าเป็นอุปกรณ์มือถือหรือไม่
            const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

            if (isMobile) {
                // เปิด LINE URL Scheme เพื่อเด้งเข้าแอป LINE เลือกห้องแชท/กลุ่มได้ทันที
                window.location.href = lineShareUrl;
            } else if (navigator.share) {
                // กรณีเบราว์เซอร์รองรับ Web Share API
                try {
                    await navigator.share({
                        title: 'คำนวณอัตราการจ่ายสารเคมี(สารส้ม)',
                        text: reportText
                    });
                } catch (err) {
                    window.open(lineShareUrl, '_blank');
                }
            } else {
                // กรณีเปิดบน Desktop เปิดหน้า LINE Share พร้อมแจ้งว่าคัดลอกข้อความแล้ว
                window.open(lineShareUrl, '_blank');
                showToast('คัดลอกข้อความและเปิดหน้าแชร์ LINE แล้ว');
            }
        }

        // คัดลอกข้อความรายงานลงคลิปบอร์ด
        function copyReportText() {
            const reportText = buildLineReportText();
            if (!reportText) return;

            copyToClipboardFallback(reportText);

            const copyBtnText = document.getElementById('copyBtnText');
            copyBtnText.textContent = 'คัดลอกแล้ว ✓';
            showToast('คัดลอกรายงานเรียบร้อย พร้อมวางในแชท');

            setTimeout(() => {
                copyBtnText.textContent = 'คัดลอกข้อความ';
            }, 2000);
        }

        function copyToClipboardFallback(text) {
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.left = '-9999px';
            document.body.appendChild(textarea);
            textarea.select();
            try {
                document.execCommand('copy');
            } catch (err) {}
            document.body.removeChild(textarea);
        }

        // แสดงข้อความแจ้งเตือนด้านล่าง
        function showToast(message) {
            const banner = document.getElementById('toastBanner');
            const msgEl = document.getElementById('toastMessage');
            msgEl.textContent = message;

            banner.classList.remove('hidden');
            banner.classList.add('flex');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                banner.classList.add('hidden');
                banner.classList.remove('flex');
            }, 2400);
        }

        // เริ่มต้นทำงานทั้งหมดเมื่อโหลดหน้าเว็บเสร็จสมบูรณ์
        window.onload = function () {
            setupPWA();
            loadSavedInputs();
            calculateAndSave();
        };
    </script>
</body>
